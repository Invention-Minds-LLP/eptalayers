[build]
  command = "npm run build"
  publish = "dist/epta-layers/browser"

[build.environment]
  NODE_VERSION = "22"

# Angular routes (/home-b, /solutions, ...) live in the browser:
# serve index.html for any path that is not a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
