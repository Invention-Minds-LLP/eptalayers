<div class="ap-scene">
  <div class="rig" [class.live]="live()">
    <!-- the cabinet assembles first -->
    <div class="cab cab-back"></div>
    <div class="cab cab-left"></div>
    <div class="cab cab-right"></div>
    <div class="cab cab-top"></div>
    <div class="cab cab-bottom"></div>
    <div class="cab rail rail-l"></div>
    <div class="cab rail rail-r"></div>

    <!-- then one unit per layer -->
    @for (u of units; track u.n; let i = $index) {
      <div class="unit" [style.--i]="i" [style.--k]="6 - i" [style.--s]="i % 2 ? 1 : -1" [class.on]="lit() === i">
        <div class="f f-top"></div>
        <div class="f f-left"></div>
        <div class="f f-right"></div>
        <div class="f f-front">
          <svg viewBox="0 0 300 44">
            <rect width="300" height="44" rx="2" class="fp" />
            <rect width="14" height="44" class="ear" />
            <rect x="286" width="14" height="44" class="ear" />
            <circle cx="7" cy="10" r="2.2" class="screw" /><circle cx="7" cy="34" r="2.2" class="screw" />
            <circle cx="293" cy="10" r="2.2" class="screw" /><circle cx="293" cy="34" r="2.2" class="screw" />
            <text x="22" y="13" class="fp-l">L{{ u.n }} · {{ u.covered }}</text>
            @switch (u.kind) {
              @case ('patch') {
                @for (k of ports24; track k) {
                  <rect [attr.x]="56 + k * 9.6" y="20" width="7" height="7" rx="1" class="port" />
                  <path [attr.d]="'M' + (59.5 + k * 9.6) + ' 27 V44'" [attr.stroke]="cableTint[k % 6]" class="stub" />
                }
              }
              @case ('switch') {
                @for (k of ports16; track k) {
                  <rect [attr.x]="70 + k * 11" y="21" width="8" height="7" rx="1" class="port" />
                  <rect [attr.x]="70 + k * 11" y="31" width="8" height="7" rx="1" class="port" />
                  <rect [attr.x]="71 + k * 11" y="17" width="3" height="2" class="led" [style.--d]="((k * 7) % 10) / 10 + 's'" />
                }
                @for (k of [0, 1, 2, 3]; track k) {
                  <rect [attr.x]="252 + (k % 2) * 15" [attr.y]="20 + (k > 1 ? 10 : 0)" width="12" height="7" rx="1" class="sfp" />
                }
              }
              @case ('router') {
                <rect x="22" y="19" width="110" height="20" rx="2" class="module" />
                <rect x="140" y="19" width="110" height="20" rx="2" class="module" />
                @for (k of ports8; track k) {
                  <rect [attr.x]="28 + k * 13" y="25" width="9" height="8" rx="1" class="port" />
                  <rect [attr.x]="146 + k * 13" y="25" width="9" height="8" rx="1" class="port" />
                }
                <circle cx="266" cy="22" r="2.4" class="led" style="--d: 0.2s" />
                <circle cx="266" cy="32" r="2.4" class="led" style="--d: 0.7s" />
              }
              @case ('sdwan') {
                <rect x="22" y="19" width="70" height="20" rx="2" class="lcd" />
                <text x="30" y="32" class="lcd-t">SD-WAN</text>
                @for (k of ports8; track k) {
                  <rect [attr.x]="110 + k * 14" y="24" width="10" height="9" rx="1" class="port" />
                }
                @for (k of [0, 1, 2]; track k) {
                  <circle [attr.cx]="244 + k * 10" cy="28" r="2.4" class="led" [style.--d]="k * 0.3 + 's'" />
                }
              }
              @case ('uc') {
                <rect x="22" y="19" width="120" height="20" rx="2" class="lcd" />
                <path d="M30 29 h8 l3 -6 l4 12 l4 -9 l3 5 h8 l3 -4 l4 7 l3 -3 h70" class="wave" />
                @for (k of [0, 1, 2, 3, 4, 5]; track k) {
                  <rect [attr.x]="160 + k * 14" y="23" width="10" height="10" rx="1" class="port" />
                }
                <circle cx="262" cy="28" r="2.4" class="led" style="--d: 0.4s" />
              }
              @case ('fw') {
                <rect x="0" y="40" width="300" height="4" class="accent" />
                <path d="M30 18 l9 3.5 v6 c0 5 -4 8.5 -9 10 c-5 -1.5 -9 -5 -9 -10 v-6 z" class="shield" />
                @for (k of ports8; track k) {
                  <rect [attr.x]="60 + k * 14" y="22" width="10" height="9" rx="1" class="port" />
                }
                @for (k of [0, 1, 2, 3]; track k) {
                  <rect [attr.x]="190 + k * 15" y="22" width="11" height="9" rx="1" class="sfp" />
                }
                <circle cx="266" cy="26" r="2.4" class="led amber" style="--d: 0.1s" />
              }
              @case ('app') {
                @for (k of ports8; track k) {
                  <rect [attr.x]="22 + k * 24" y="18" width="20" height="21" rx="1.5" class="bay" />
                  <rect [attr.x]="25 + k * 24" y="34" width="5" height="2" class="led" [style.--d]="((k * 3) % 8) / 8 + 's'" />
                }
                @for (k of [0, 1, 2, 3, 4]; track k) {
                  <path [attr.d]="'M' + (220 + k * 9) + ' 20 V37'" class="vent" />
                }
                <circle cx="272" cy="28" r="4" class="power" />
              }
            }
          </svg>
        </div>
      </div>
    }

    <!-- finale: patch cables drawn across the front -->
    <svg class="cables" viewBox="0 0 326 404" aria-hidden="true">
      @for (k of [0, 1, 2, 3, 4, 5]; track k) {
        <path
          pathLength="1"
          [attr.stroke]="cableTint[k]"
          [attr.d]="'M' + (78 + k * 30) + ' 370 C' + (64 + k * 30) + ' 392, ' + (110 + k * 26) + ' 352, ' + (96 + k * 26) + ' 318'"
        />
      }
      @for (k of [0, 1, 2]; track k) {
        <path
          pathLength="1"
          [attr.stroke]="cableTint[k + 2]"
          [attr.d]="'M' + (266 + (k % 2) * 15) + ' ' + (300 + (k > 1 ? 10 : 0)) + ' C 318 ' + (290 - k * 6) + ', 318 ' + (262 - k * 6) + ', ' + (190 + k * 13) + ' 252'"
        />
      }
    </svg>
  </div>
  <p class="sentinel"><i></i>Your 24x7 Network Sentinel</p>
</div>
