    <!--
      Netlify Forms reads these at deploy time to register the two forms; the Angular forms post to them.
      Field names must match the app. Hidden from people and never submitted directly.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="company" />
      <input name="service" />

      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="location" />

      <input name="current-company" />
      <input name="notice-period" />
      <input name="current-ctc" />
      <input name="expected-ctc" />
